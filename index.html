<!DOCTYPE html>
<html lang="ru">
<head>

  <title>Моё приложение</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;

    .container {

    h1 {

<body>

    <h1>Моё приложение</h1>
    <p>Добро пожаловать!</p>

    </button>

</html>
